site_name: geo2wf
site_description: Satellite-based tropical-cyclone wind-field reconstruction and intensity estimation
site_url: https://tcd.hyperalis.com/
repo_url: https://github.com/simon-donike/geo2wf
repo_name: simon-donike/geo2wf
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 geo2wf contributors

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/branding/FDL_ESL_white.png
  favicon: assets/images/mark.svg
  font: false
  icon:
    repo: fontawesome/brands/github
    annotation: material/plus-circle
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    scheme: default
    primary: custom
    accent: custom

nav:
  - Home: index.md
  - Paper:
      - Reasoning and methods: concepts/problem.md
      - Results: results.md
  - Get started:
      - Installation and access: getting-started/installation.md
      - First experiment: getting-started/first-experiment.md
  - Data:
      - Dataset on Hugging Face: data/index.md
      - Local layout and tensors: data/dataset-contract.md
      - Paired export inventory: data/full-dataset.md
      - Export GEO–SAR: data/export-geo-sar.md
  - Models:
      - Models and checkpoints: models/index.md
      - Field U-Net: models/era5-residual.md
      - Joint field and latent MLP: models/bottleneck-unet-mlp.md
      - Post-hoc correction: models/intensity-correction.md
      - Six-hour forecast: models/intensity-forecast.md
  - Usage:
      - Training and checkpoints: experiments/training.md
      - Evaluation: experiments/evaluation.md
      - Commands: reference/commands.md
      - Troubleshooting: reference/troubleshooting.md
      - Code map: reference/index.md
  - StormSense:
      - Viewer guide: explorer.md
      - Observation manifest: data/storm-manifest.md

# Keep local, ignored research renders out of documentation builds.
exclude_docs: |
  assets/images/*.gif
  assets/images/final-results/category-4-5-triptychs/

plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 95vw
      height: auto
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - assets/vendor/simple-datatables/simple-datatables.css
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - assets/vendor/simple-datatables/simple-datatables.js
  - assets/javascripts/extra.js
