site_name: geo2wf
site_description: Satellite-based tropical-cyclone wind-field reconstruction and intensity estimation
site_url: https://tcd.hyperalis.com/
repo_url: https://github.com/simon-donike/geo2wf
repo_name: simon-donike/geo2wf
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 geo2wf contributors

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/branding/FDL_ESL_white.png
  favicon: assets/images/mark.svg
  font: false
  icon:
    repo: fontawesome/brands/github
    annotation: material/plus-circle
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    scheme: default
    primary: custom
    accent: custom

nav:
  - Home: index.md
  - Start here:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - First experiment: getting-started/first-experiment.md
  - Science and system:
      - Scientific problem and observations: concepts/problem.md
      - System architecture: concepts/architecture.md
      - Modular package architecture: concepts/modular-architecture.md
  - Data:
      - Inputs and targets: data/index.md
      - Storm observation manifest: data/storm-manifest.md
      - Full dataset table: data/full-dataset.md
      - Dataset contract: data/dataset-contract.md
      - Normalization & masks: data/normalization.md
      - Export GEO–SAR: data/export-geo-sar.md
      - PMW proxy pretraining: data/export-geo-pmw.md
      - Hosting dashboard data on R2: data/r2-hosting.md
  - Models:
      - Model overview: models/index.md
      - ERA5-residual U-Net: models/era5-residual.md
      - Direct PMW U-Net: models/direct-unet.md
      - Single-field intensity correction: models/intensity-correction.md
      - Bottleneck U-Net + MLP: models/bottleneck-unet-mlp.md
      - Six-hour scalar intensity forecast: models/intensity-forecast.md
  - Experiments:
      - Choose an experiment: experiments/index.md
      - Configuration guide: experiments/configuration.md
      - Training & checkpoints: experiments/training.md
      - Evaluation & metrics: experiments/evaluation.md
      - Intensity model comparison: experiments/intensity-comparison.md
      - Completed intensity benchmark: experiments/intensity-comparison-results.md
      - Visual examples: experiments/visual-examples.md
      - HPC & multi-GPU: experiments/hpc.md
  - Reference:
      - Project map: reference/index.md
      - Adding models, datasets, and metrics: reference/adding-components.md
      - Configuration reference: reference/configuration.md
      - Commands & environment: reference/commands.md
      - Troubleshooting: reference/troubleshooting.md
      - Glossary: reference/glossary.md
  - StormSense: explorer.md

plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 95vw
      height: auto
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - assets/vendor/simple-datatables/simple-datatables.css
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - assets/vendor/simple-datatables/simple-datatables.js
  - assets/javascripts/extra.js
