data:
  _target_: geo2wf.data.intensity_forecast.IntensityForecastDataModule
  root: data/intensity_forecast
  train_split: pretrain_train
  val_split: pretrain_val
  test_split: pretrain_val
  batch_size: 256
  num_workers: 2
  pin_memory: false
  persistent_workers: false
  maximum_delta_weight_ratio: 4.0
  ri_storm_ids: []
model:
  _target_: geo2wf.models.intensity_forecast.IntensityForecastMLP
  feature_count: 5
  hidden_features:
  - 32
  - 16
  dropout: 0.1
  huber_delta_ms: 5.0
  lr: 0.0003
  weight_decay: 0.0001
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 10
  lr_scheduler_min_lr: 1.0e-06
  log_wandb_full_storm_media: false
  log_wandb_ri_media: false
trainer:
  max_epochs: 1000
  accelerator: gpu
  devices: 1
  precision: 32
  deterministic: true
  float32_matmul_precision: high
  log_every_n_steps: 10
  enable_checkpointing: true
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  default_root_dir: logs
  checkpoint:
    filename: epoch={epoch:03d}-step={step}
    monitor: val/storm_macro_mae_ms
    mode: min
    save_top_k: 2
    save_last: true
logging:
  wandb:
    enabled: true
    project: geo2wf
    name: intensity-forecast-ibtracs-pretrain
    log_model: false
seed: 42
