data:
  _target_: geo2wf.data.intensity.UNetIntensityDataModule
  root: /work/code/geo2wf/data/unet_intensity_geostat_nopmw_v2
  train_split: train
  val_split: val
  test_split: test
  batch_size: 16
  num_workers: 2
  pin_memory: false
  persistent_workers: false
  expected_unet_checkpoint_sha256: null
  verify_cache: true
  max_category_weight_ratio: 4.0
model:
  _target_: geo2wf.models.intensity_correction.UNetIntensityCorrection
  metadata_features: 19
  field_base_channels: 16
  field_channel_mults:
  - 1
  - 2
  - 4
  - 8
  metadata_hidden_features: 32
  fusion_hidden_features: 128
  dropout: 0.1
  wind_soft_scale_ms: 20.0
  huber_delta_ms: 5.0
  use_field: true
  use_metadata: true
  lr: 0.0003
  weight_decay: 0.0001
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 10
  lr_scheduler_min_lr: 1.0e-06
  log_wandb_validation_media: true
  validation_plot_storm_count: 3
  validation_plot_storm_ids: []
trainer:
  max_epochs: 200
  accelerator: gpu
  devices: 2
  precision: 32
  deterministic: true
  float32_matmul_precision: high
  log_every_n_steps: 10
  enable_checkpointing: true
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  default_root_dir: logs
  checkpoint:
    filename: epoch={epoch:03d}-step={step}
    monitor: val/storm_macro_mae_ms
    mode: min
    save_top_k: 2
    save_last: true
  strategy: ddp_find_unused_parameters_false
logging:
  wandb:
    enabled: true
    project: geo2wf
    name: unet-intensity-correction-geostat-nopmw-v2-20260804T183843Z
    log_model: true
seed: 42
