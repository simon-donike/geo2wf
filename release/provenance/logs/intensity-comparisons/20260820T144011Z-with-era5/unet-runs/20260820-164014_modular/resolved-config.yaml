data:
  _target_: geo2wf.data.joint_intensity.JointPairedIntensityDataModule
  root: /work/code/geo2wf/data/geotiff/geo_sar_10bands_era5_v2_pmw
  ibtracs_file: /work/code/geo2wf/data/IBTrACs/ibtracs.ALL.list.v04r01.csv
  max_ibtracs_bracket_hours: 3.0
  stats_file: /work/code/geo2wf/data/geotiff/geo_sar_10bands_era5_v2_pmw/stats.json
  train_split: train
  val_split: val
  test_split: test
  target_size:
  - 256
  - 256
  center_crop_size:
  - 192
  - 192
  random_flips: true
  include_test_in_train: false
  require_era5: true
  use_era5: true
  include_pmw: false
  pmw_as_condition: false
  include_ibtracs: false
  normalization: robust-zscore
  target_normalization: min-max
  robust_clip: 4.0
  max_era5_time_gap_hours: 3.1
  intensity_balanced_sampling: false
  batch_size: 4
  num_workers: 2
  pin_memory: false
  persistent_workers: false
model:
  _target_: geo2wf.models.deterministic_residual.ERA5ResidualRegressor
  condition_channels: 23
  use_era5: true
  base_channels: 32
  channel_mults:
  - 1
  - 2
  - 4
  - 8
  huber_delta_ms: 2.0
  off_swath_anchor_weight: 0.05
  high_wind_threshold_ms: 17.0
  high_wind_weight_max: 8.0
  high_wind_weight_start_ms: 25.0
  high_wind_weight_full_ms: 50.0
  peak_loss_weight: 0.05
  peak_top_fraction: 0.005
  peak_min_pixels: 16
  peak_inner_core_radius_km: 100.0
  radial_profile_loss_weight: 0.0
  radial_profile_max_radius_km: 200.0
  radial_profile_bin_km: 10.0
  radial_profile_min_bin_pixels: 8
  exceedance_area_loss_weight: 0.0
  exceedance_area_thresholds_ms:
  - 17.0
  - 33.0
  - 43.0
  exceedance_area_temperature_ms: 2.0
  peak_structure_radial_weight: 0.25
  peak_structure_area_weight: 10.0
  prediction_min_ms: 0.0
  prediction_max_ms: null
  psnr_data_range_ms: 79.8
  lr: 0.0002
  weight_decay: 0.0001
  lr_scheduler_factor: 0.75
  lr_scheduler_patience: 100
  lr_scheduler_monitor: val/peak_structure_score
  lr_scheduler_cooldown: 5
  lr_scheduler_min_lr: 2.0e-05
  validation_reconstruction_batches: 1
  log_reconstruction_images: false
trainer:
  max_epochs: 1000
  accelerator: gpu
  devices:
  - 1
  precision: 32
  deterministic: true
  float32_matmul_precision: high
  log_every_n_steps: 10
  enable_checkpointing: true
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  default_root_dir: /work/code/geo2wf/logs/intensity-comparisons/20260820T144011Z-with-era5/unet-runs
  checkpoint:
    filename: epoch={epoch:03d}-step={step}
    monitor: val/eye_structure_score
    mode: min
    save_top_k: 2
    save_last: true
  early_stopping:
    enabled: true
    monitor: val/eye_structure_score
    mode: min
    patience: 50
logging:
  wandb:
    enabled: true
    project: geo2wf
    name: intensity-comparison-with-era5-unet-20260820T144011Z
    log_model: false
seed: 42
