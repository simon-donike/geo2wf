data:
  _target_: geo2wf.data.joint_intensity.JointPairedIntensityDataModule
  root: /work/code/geo2wf/data/geotiff/geo_sar_10bands_era5_v2_pmw
  ibtracs_file: /work/code/geo2wf/data/IBTrACs/ibtracs.ALL.list.v04r01.csv
  max_ibtracs_bracket_hours: 3.0
  stats_file: /work/code/geo2wf/data/geotiff/geo_sar_10bands_era5_v2_pmw/stats.json
  train_split: train
  val_split: val
  test_split: test
  target_size:
  - 256
  - 256
  center_crop_size:
  - 192
  - 192
  random_flips: true
  include_test_in_train: false
  require_era5: true
  use_era5: false
  include_pmw: false
  pmw_as_condition: false
  include_ibtracs: false
  normalization: robust-zscore
  target_normalization: min-max
  robust_clip: 4.0
  max_era5_time_gap_hours: 3.1
  intensity_balanced_sampling: false
  batch_size: 4
  num_workers: 2
  pin_memory: false
  persistent_workers: false
model:
  _target_: geo2wf.models.bottleneck_unet_mlp.BottleneckUNetMLPRegressor
  condition_channels: 14
  base_channels: 32
  channel_mults:
  - 1
  - 2
  - 4
  - 8
  intensity_hidden_features: 128
  intensity_dropout: 0.1
  initial_intensity_ms: 25.0
  image_huber_delta_ms: 2.0
  intensity_huber_delta_ms: 5.0
  image_loss_weight: 1.0
  intensity_loss_weight: 1.0
  lr: 0.0002
  weight_decay: 0.0001
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 25
  lr_scheduler_cooldown: 0
  lr_scheduler_min_lr: 0.0
  validation_reconstruction_batches: 1
  log_reconstruction_images: true
trainer:
  max_epochs: 1000
  accelerator: gpu
  devices:
  - 0
  precision: 32
  deterministic: true
  float32_matmul_precision: high
  log_every_n_steps: 10
  enable_checkpointing: true
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  default_root_dir: /work/code/geo2wf/logs/intensity-comparisons/20260820T155344Z-without-era5/joint-runs
  checkpoint:
    filename: epoch={epoch:03d}-step={step}
    monitor: val/loss
    mode: min
    save_top_k: 2
    save_last: true
  early_stopping:
    enabled: true
    monitor: val/loss
    mode: min
    patience: 50
logging:
  wandb:
    enabled: true
    project: geo2wf
    name: intensity-comparison-without-era5-joint-20260820T155344Z
    log_model: false
seed: 42
