data:
  _target_: geo2wf.data.intensity.UNetIntensityDataModule
  root: data/unet_intensity_structure_v3
  train_split: train
  val_split: val
  test_split: test
  batch_size: 16
  num_workers: 2
  pin_memory: false
  persistent_workers: false
  expected_unet_checkpoint_sha256: null
  verify_cache: true
  max_category_weight_ratio: 4.0
model:
  _target_: geo2wf.models.intensity_correction.UNetIntensityCorrection
  metadata_features: 19
  field_base_channels: 16
  field_channel_mults:
  - 1
  - 2
  - 4
  - 8
  metadata_hidden_features: 32
  fusion_hidden_features: 128
  dropout: 0.1
  wind_soft_scale_ms: 20.0
  anchor_statistic: max
  robust_peak_fraction: 0.005
  huber_delta_ms: 5.0
  structure_head_enabled: false
  structure_loss_weight: 0.0
  structure_huber_delta_km: 20.0
  use_field: true
  use_metadata: true
  lr: 0.0003
  weight_decay: 0.0001
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 10
  lr_scheduler_min_lr: 1.0e-06
  log_wandb_validation_media: true
  validation_plot_storm_count: 3
  validation_plot_storm_ids: []
trainer:
  max_epochs: 200
  accelerator: gpu
  devices: 1
  precision: 32
  deterministic: true
  float32_matmul_precision: high
  log_every_n_steps: 10
  enable_checkpointing: true
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  default_root_dir: logs/intensity-structure/unet-image-radii
  checkpoint:
    filename: epoch={epoch:03d}-step={step}
    monitor: val/storm_macro_mae_ms
    mode: min
    save_top_k: 2
    save_last: true
  early_stopping:
    enabled: true
    monitor: val/storm_macro_mae_ms
    mode: min
    patience: 50
logging:
  wandb:
    enabled: false
    project: geo2wf
    name: unet-correction-image-radii
    group: intensity-structure
    job_type: training
    tags:
    - unet-correction
    - image-radii
    log_model: false
seed: 42
