data:
  _target_: geo2wf.data.joint_intensity.JointPairedIntensityDataModule
  root: data/geotiff/geo_sar_10bands_era5_v2_pmw
  ibtracs_file: data/IBTrACs/ibtracs.ALL.list.v04r01.csv
  max_ibtracs_bracket_hours: 3.0
  intensity_target_source: ibtracs
  require_sar_valid_center: true
  sar_robust_peak_fraction: 0.005
  ri_threshold_kt: 30.0
  ri_window_hours: 24.0
  stats_file: data/geotiff/geo_sar_10bands_era5_v2_pmw/stats.json
  train_split: train
  val_split: val
  test_split: test
  target_size:
  - 256
  - 256
  center_crop_size:
  - 192
  - 192
  random_flips: true
  include_test_in_train: false
  require_era5: true
  use_era5: true
  include_pmw: false
  pmw_as_condition: false
  include_ibtracs: false
  normalization: robust-zscore
  target_normalization: min-max
  robust_clip: 4.0
  max_era5_time_gap_hours: 3.1
  intensity_balanced_sampling: false
  batch_size: 4
  num_workers: 2
  pin_memory: false
  persistent_workers: false
model:
  _target_: geo2wf.models.bottleneck_unet_mlp.BottleneckUNetMLPRegressor
  condition_channels: 23
  base_channels: 32
  channel_mults:
  - 1
  - 2
  - 4
  - 8
  intensity_hidden_features: 128
  intensity_dropout: 0.1
  initial_intensity_ms: 25.0
  image_huber_delta_ms: 2.0
  intensity_huber_delta_ms: 5.0
  image_loss_weight: 1.0
  intensity_loss_weight: 1.0
  structure_head_enabled: true
  structure_loss_weight: 0.25
  structure_huber_delta_km: 20.0
  lr: 0.0002
  weight_decay: 0.0001
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 25
  lr_scheduler_cooldown: 0
  lr_scheduler_min_lr: 0.0
  validation_reconstruction_batches: 1
  log_reconstruction_images: true
  sar_robust_peak_fraction: 0.005
trainer:
  max_epochs: 1000
  accelerator: gpu
  devices: 1
  precision: 32
  deterministic: false
  float32_matmul_precision: high
  log_every_n_steps: 10
  enable_checkpointing: true
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  default_root_dir: logs/latent-matrix/sar/era5/max-wind-radii
  checkpoint:
    filename: epoch={epoch:03d}-step={step}
    monitor: val/loss
    mode: min
    save_top_k: 2
    save_last: true
  early_stopping:
    enabled: true
    monitor: val/loss
    mode: min
    patience: 50
logging:
  wandb:
    enabled: false
    project: geo2wf
    name: latent-mlp-sar-era5-max-wind-radii
    group: latent-mlp-matrix
    job_type: training
    tags:
    - sar
    - era5
    - max-wind-radii
    log_model: false
seed: 42
