# @package _global_
defaults:
  - override /data: joint_geo_sar_ibtracs
  - override /model: bottleneck_unet_mlp

# Multi-task counterpart: the latent head learns maximum wind plus IBTrACS
# RMW/R34/R50/R64. Eye size remains masked because this cohort has no labels.
model:
  structure_head_enabled: true
  structure_loss_weight: 0.25

trainer:
  max_epochs: 1000
  accelerator: gpu
  devices: 1
  # Reflection-padding backward has no deterministic CUDA implementation.
  deterministic: false
  default_root_dir: logs/latent-structure/max-wind-radii
  checkpoint:
    monitor: val/loss
    mode: min
    save_top_k: 2
    save_last: true
  early_stopping:
    enabled: true
    monitor: val/loss
    mode: min
    patience: 50

logging:
  wandb:
    name: bottleneck-unet-mlp-max-wind-radii
    group: latent-structure
    project: geo2wf
    tags: [joint-unet-mlp, max-wind-radii, era5]
    enabled: false
    log_model: false
