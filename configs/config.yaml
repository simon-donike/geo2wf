# Global random seed for reproducibility across dataloading and model init.
seed: 42

data:
  loader:
    # Number of samples per optimization step.
    batch_size: 4
    # Number of worker processes used by PyTorch DataLoader.
    num_workers: 0
    # Pin CPU memory for faster transfer to GPU (usually true when training on CUDA).
    pin_memory: false

model:
  # Channels in the conditional input x.
  in_channels: 2
  # Channels in the reconstruction target y.
  out_channels: 2
  # Number of diffusion denoising steps.
  num_timesteps: 1000
  # Beta schedule variant for the forward process.
  schedule: linear
  unet:
    # Base UNet width. Previous setting was 64; 48 reduces parameter count.
    dim: 48
    # Width multipliers per UNet level.
    dim_mults: [1, 2, 4, 8]
    # Input channels to UNet; for conditional concat this is usually in_channels + out_channels.
    channels: 4
    # UNet output channels; should match model.out_channels.
    out_dim: 2

optimization:
  # AdamW learning rate.
  lr: 0.0001
  reduce_lr_on_plateau:
    # Multiplicative LR drop factor when metric plateaus.
    factor: 0.5
    # Number of bad validation epochs before LR is reduced.
    patience: 10

trainer:
  # Total number of training epochs.
  max_epochs: 100
  # Lightning accelerator selection: auto/cpu/gpu/mps.
  accelerator: auto
  # Number of devices to use (e.g. 1 for single GPU/CPU process).
  devices: 1
  # Numeric precision used by Lightning.
  precision: 32
  # Logging frequency in training steps.
  log_every_n_steps: 10
  # Disable Lightning checkpoint callback by default.
  enable_checkpointing: false
  # Validation coverage per epoch. Float in [0,1] or int number of batches.
  limit_val_batches: 50

logging:
  wandb:
    # Weights & Biases project name.
    project: dif_img_rec
    # Optional run name; null lets W&B auto-generate one.
    name: null
    # Local directory used by W&B for run files.
    save_dir: logs
    # Whether to upload model artifacts automatically.
    log_model: false
