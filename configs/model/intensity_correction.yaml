_target_: geo2wf.models.intensity_correction.UNetIntensityCorrection
metadata_features: 19
field_base_channels: 16
field_channel_mults: [1, 2, 4, 8]
metadata_hidden_features: 32
fusion_hidden_features: 128
dropout: 0.1
wind_soft_scale_ms: 20.0
anchor_statistic: max
robust_peak_fraction: 0.005
huber_delta_ms: 5.0
# Optional multi-task IBTrACS structure outputs. This works with either the
# field+metadata model or an MLP-only run configured with use_field=false.
structure_head_enabled: false
structure_loss_weight: 0.0
structure_huber_delta_km: 20.0
use_field: true
use_metadata: true
lr: 0.0003
weight_decay: 0.0001
lr_scheduler_factor: 0.5
lr_scheduler_patience: 10
lr_scheduler_min_lr: 0.000001
log_wandb_validation_media: true
validation_plot_storm_count: 3
validation_plot_storm_ids: []
