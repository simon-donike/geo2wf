_target_: geo2wf.models.bottleneck_unet_mlp.BottleneckUNetMLPRegressor
condition_channels: 23
base_channels: 32
channel_mults: [1, 2, 4, 8]
intensity_hidden_features: 128
intensity_dropout: 0.1
initial_intensity_ms: 25.0
image_huber_delta_ms: 2.0
intensity_huber_delta_ms: 5.0
image_loss_weight: 1.0
intensity_loss_weight: 1.0
# Optional multi-task IBTrACS structure head: eye size, RMW, and equivalent-area
# R34/R50/R64 radii. Set enabled=true and weight>0 to train it.
structure_head_enabled: false
structure_loss_weight: 0.0
structure_huber_delta_km: 20.0
lr: 0.0002
weight_decay: 0.0001
lr_scheduler_factor: 0.5
lr_scheduler_patience: 25
lr_scheduler_cooldown: 0
lr_scheduler_min_lr: 0.0
validation_reconstruction_batches: 1
log_reconstruction_images: true
sar_robust_peak_fraction: ${data.sar_robust_peak_fraction}
