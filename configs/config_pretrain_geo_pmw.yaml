seed: 42  # Global random seed for reproducibility across dataloading and model init.

export:
  data_root: /lustre/scratch/1054/tropical_cyclone_dynamics/data
  manifest_file: /lustre/scratch/1054/tropical_cyclone_dynamics/data/index-files/observation_manifest_v5.csv
  output_root: data/geotiff/geo_pmw
  geo_channel_set: common4
  splits: [train, val, test]
  grid_size: 256
  grid_resolution: 0.027
  closest_match_hours: 0.5
  center: image_center
  shift_center: true
  pad: 8
  limit: null
  pmw_sensors: [AMSR2_GCOMW1, GMI_GPM, SSMIS_F16, SSMIS_F17, SSMIS_F18]

data:
  root: data/geotiff/geo_pmw
  stats_file: data/geotiff/geo_pmw/stats.json
  train_split: train
  val_split: val
  test_split: test
  target_size: [256, 256]
  random_flips: true
  include_test_in_train: true  # Add the test split to training; validation stays separate.
  loader:
    batch_size: 4  # Number of samples per optimization step.
    num_workers: 0  # Number of worker processes used by PyTorch DataLoader.
    pin_memory: false  # Pin CPU memory for faster transfer to GPU (usually true when training on CUDA).
    persistent_workers: false

model:
  in_channels: 5  # Four GEO bands plus one binary valid-pixel mask.
  out_channels: 1  # One PMW brightness-temperature target channel, matching SAR target shape.
  num_timesteps: 1000  # Number of diffusion denoising steps.
  schedule: linear  # Beta schedule variant for the forward process.
  unet:
    dim: 48  # Base UNet width. Keep exactly aligned with SAR training.
    dim_mults: [1, 2, 4, 8]  # Width multipliers per UNet level.
    channels: 6  # Five condition channels plus one noisy target channel.
    out_dim: 1  # UNet output channels; should match model.out_channels.

optimization:
  lr: 0.0001  # AdamW learning rate.
  reduce_lr_on_plateau:
    factor: 0.5  # Multiplicative LR drop factor when metric plateaus.
    patience: 25  # Number of bad validation epochs before LR is reduced.

trainer:
  max_epochs: 100  # Total number of training epochs.
  accelerator: auto  # Lightning accelerator selection: auto/cpu/gpu/mps.
  devices: 1  # Number of devices to use (e.g. 1 for single GPU/CPU process).
  precision: 32  # Numeric precision used by Lightning.
  log_every_n_steps: 10  # Logging frequency in training steps.
  enable_checkpointing: false  # Disable Lightning checkpoint callback by default.
  limit_val_batches: 50  # Validation coverage per epoch. Float in [0,1] or int number of batches.

logging:
  wandb:
    enabled: true  # Set false or export WANDB_DISABLED=true for local smoke tests.
    project: dif_img_rec  # Weights & Biases project name.
    name: geo-pmw-pretrain  # Distinguish proxy pretraining runs from SAR fine-tuning.
    save_dir: logs  # Local directory used by W&B for run files.
    log_model: false  # Whether to upload model artifacts automatically.
