seed: 42

export:
  data_root: /lustre/scratch/1054/tropical_cyclone_dynamics/data
  manifest_file: /lustre/scratch/1054/tropical_cyclone_dynamics/data/index-files/observation_manifest_v5.csv
  output_root: data/geotiff/geo_sar_10bands_era5
  geo_channel_set: common10
  include_era5: true
  era5_max_time_gap_hours: 3.1
  era5_channels:
    - precipitable_water
    - sst
    - pressure_msl
    - temperature_2m
    - dewpoint_2m
    - u_wind_10m
    - v_wind_10m
  splits: [train, val, test]
  grid_size: 256
  grid_resolution: 0.027
  closest_match_hours: 0.5
  center: image_center
  shift_center: true
  pad: 8
  limit: null

data:
  root: data/geotiff/geo_sar_10bands_era5
  stats_file: data/geotiff/geo_sar_10bands_era5/stats.json
  train_split: train
  val_split: val
  test_split: test
  target_size: [256, 256]
  center_crop_size: [192, 192]
  normalization: robust-zscore
  robust_clip: 4.0
  # Wind speed is non-negative and has a meaningful finite train range; this
  # prevents symmetric robust clipping from admitting negative samples.
  target_normalization: min-max
  max_era5_time_gap_hours: 3.1
  random_flips: true
  include_test_in_train: true
  loader:
    batch_size: 4
    num_workers: 2
    pin_memory: false
    persistent_workers: false

model:
  type: diffusion_residual
  # Prepared condition: ten GEO + nine ERA5 + distance + aggregate valid mask.
  # ERA5ResidualDiffusion appends the exact baseline and its validity mask.
  in_channels: 21
  out_channels: 1
  num_timesteps: 1000
  schedule: cosine
  sampling:
    method: ddim
    timesteps: 100
    eta: 0.0
    # Diversity comes from distinct initial latents; CFG strengthens baseline/GEO fidelity.
    guidance_scale: 1.5
    clip_sample: true
  classifier_free_guidance:
    # Required during training so guidance_scale can trade diversity for fidelity.
    condition_dropout_probability: 0.1
  sparse_target:
    # Outside SAR coverage, weakly teach the generated correction to be zero.
    fill: era5
    unobserved_loss_weight: 0.05
  residual:
    # Portable default. To learn a residual on top of the trained deterministic
    # GEO+ERA5 model, change source to deterministic and set checkpoint_path or
    # the GEO2WF_BASELINE_CKPT environment variable.
    baseline:
      source: deterministic
      checkpoint_path: logs/20260729-172117_config_geo_sar_10bands_era5_residual/checkpoints/epoch=062-step=7686.ckpt
    # Odd asinh transform: resolves small corrections without clipping the rare
    # intense positive tail into the narrow bulk of the residual distribution.
    soft_scale_ms: 5.0
    clip_ms: 80.0
    prediction_min_ms: 0.0
    prediction_max_ms: 80.0
    loss:
      # Preserve the probabilistic diffusion objective while explicitly rewarding
      # sharp, SAR-like residual structure at stable low/medium noise levels.
      gradient_weight: 0.05
      spectrum_weight: 0.05
      low_frequency_weight: 0.1
      auxiliary_max_timestep_fraction: 0.5
      high_wind_threshold_ms: 17.0
      high_wind_weight: 2.0
      inner_core_radius_km: 100.0
      inner_core_weight: 2.0
      high_gradient_threshold_ms: 2.0
      high_gradient_weight: 2.0
      low_frequency_kernel_size: 9
  unet:
    dim: 48
    dim_mults: [1, 2, 4, 8]
    channels: 24  # Noisy residual + 23 prepared condition channels.
    out_dim: 1

optimization:
  lr: 0.00005
  # Balance low- and high-noise denoising problems instead of overfitting easy steps.
  min_snr_gamma: 5.0
  ema:
    enabled: true
    decay: 0.999
    update_after_step: 0
    use_for_eval: true
  reduce_lr_on_plateau:
    factor: 0.75
    patience: 100
    monitor: val/probabilistic_refinement_score
    cooldown: 5
    min_lr: 0.00001

trainer:
  max_epochs: 5000
  accelerator: auto
  devices: 2
  strategy: ddp_find_unused_parameters_false
  precision: 32
  float32_matmul_precision: high
  log_every_n_steps: 10
  enable_checkpointing: true
  limit_val_batches: 50
  deterministic: true
  checkpoint:
    monitor: val/probabilistic_refinement_score
    mode: min
    save_top_k: 2
    save_last: true

validation:
  reconstruction_batches: 3
  # Four fixed members expose calibrated diversity without blurring them together.
  ensemble_size: 4
  ensemble_batches: 1
  sampling_seed: 42
  probabilistic_score_sharpness_weight: 2.0

logging:
  wandb:
    enabled: true
    project: dif_img_rec
    name: geo-sar-10bands-era5-diffusion-residual-deterministic
    save_dir: logs
    log_model: false
