seed: 42

export:
  data_root: /lustre/scratch/1054/tropical_cyclone_dynamics/data
  manifest_file: /lustre/scratch/1054/tropical_cyclone_dynamics/data/index-files/observation_manifest_v5.csv
  output_root: data/geotiff/geo_sar_10bands_era5
  geo_channel_set: common10
  include_era5: true
  era5_max_time_gap_hours: 3.1
  era5_channels:
    - precipitable_water
    - sst
    - pressure_msl
    - temperature_2m
    - dewpoint_2m
    - u_wind_10m
    - v_wind_10m
  splits: [train, val, test]
  grid_size: 256
  grid_resolution: 0.027
  closest_match_hours: 0.5
  include_pmw: false
  pmw_max_time_gap_hours: 12.0
  include_ibtracs: false
  ibtracs_max_time_gap_hours: 6.1
  center: image_center
  shift_center: true
  pad: 8
  limit: null

data:
  root: data/geotiff/geo_sar_10bands_era5
  stats_file: data/geotiff/geo_sar_10bands_era5/stats.json
  train_split: train
  val_split: val
  test_split: test
  target_size: [256, 256]
  center_crop_size: [192, 192]
  normalization: robust-zscore
  robust_clip: 4.0
  # Wind speed is non-negative and has a meaningful finite train range; this
  # prevents symmetric robust clipping from admitting negative samples.
  target_normalization: min-max
  max_era5_time_gap_hours: 3.1
  random_flips: true
  include_test_in_train: true
  include_pmw: false
  include_ibtracs: false
  loader:
    batch_size: 4
    num_workers: 2
    pin_memory: false
    persistent_workers: false

model:
  type: diffusion_residual
  # Prepared condition: ten GEO + nine ERA5 + distance + three solar fields + mask.
  # ERA5ResidualDiffusion appends the exact baseline and its validity mask.
  in_channels: 24
  out_channels: 1
  num_timesteps: 1000
  schedule: cosine
  sampling:
    method: ddim
    timesteps: 100
    eta: 0.0
    # Diversity comes from distinct initial latents; CFG strengthens baseline/GEO fidelity.
    guidance_scale: 1.2
    clip_sample: true
  classifier_free_guidance:
    # Required during training so guidance_scale can trade diversity for fidelity.
    condition_dropout_probability: 0.1
    preserve_baseline_condition_on_dropout: true
  sparse_target:
    # Outside SAR coverage, weakly teach the generated correction to be zero.
    fill: era5
    unobserved_loss_weight: 0.1
  residual:
    # Portable default. To learn a residual on top of the trained deterministic
    # GEO+ERA5 model, change source to deterministic and set checkpoint_path or
    # the GEO2WF_BASELINE_CKPT environment variable.
    baseline:
      source: deterministic
      # Best completed Model B (stage1_peak_aware). Set this to another
      # artifact for a different baseline; the environment variable is used
      # when this path is null.
      checkpoint_path: logs/ablation-suites/refinement-rerun-20260731T130254Z/runs/stage1_peak_aware/checkpoints/epoch=020-step=5103.ckpt
    # Odd asinh transform: resolves small corrections without clipping the rare
    # intense positive tail into the narrow bulk of the residual distribution.
    soft_scale_ms: 5.0
    clip_ms: 80.0
    prediction_min_ms: 0.0
    prediction_max_ms: 80.0
    loss:
      # Keep the refinement coherent without reproducing every pixel-scale SAR
      # edge. The weak TV term only smooths the learned residual, not the baseline.
      gradient_weight: 0.015
      spectrum_weight: 0.01
      low_frequency_weight: 0.15
      smoothness_weight: 0.02
      auxiliary_max_timestep_fraction: 0.5
      # Selected Stage 2 default: structured residual refinement in asinh space.
      high_wind_threshold_ms: 25.0
      high_wind_weight: 4.0
      inner_core_radius_km: 100.0
      inner_core_weight: 2.0
      high_gradient_threshold_ms: 2.0
      high_gradient_weight: 1.25
      low_frequency_kernel_size: 9
      robust_peak_weight: 0.03
      robust_peak_fraction: 0.005
      radial_profile_weight: 0.1
      radial_profile_bins: 20
      radial_profile_max_radius_km: 200.0
      exceedance_area_weight: 2.0
      exceedance_thresholds_ms: [17.0, 33.0, 43.0]
      exceedance_temperature_ms: 2.0
      multiscale_field_weight: 0.05
      multiscale_kernel_sizes: [1, 3, 9, 21]
      annular_residual_weight: 0.02
  unet:
    dim: 48
    dim_mults: [1, 2, 4, 8]
    channels: 27  # Noisy residual + 26 prepared condition channels.
    out_dim: 1

optimization:
  lr: 0.00005
  # Balance low- and high-noise denoising problems instead of overfitting easy steps.
  min_snr_gamma: 5.0
  ema:
    enabled: true
    decay: 0.999
    update_after_step: 0
    use_for_eval: true
  reduce_lr_on_plateau:
    factor: 0.5
    patience: 200
    monitor: val/probabilistic_refinement_score
    cooldown: 5
    min_lr: 0.00001

trainer:
  max_epochs: 10000
  accelerator: auto
  devices: 2
  strategy: ddp_find_unused_parameters_false
  precision: 32
  float32_matmul_precision: high
  log_every_n_steps: 10
  enable_checkpointing: true
  limit_val_batches: 50
  deterministic: true
  checkpoint:
    monitor: val/probabilistic_refinement_score
    mode: min
    save_top_k: 2
    save_last: true

validation:
  reconstruction_batches: 3
  # Four fixed members expose calibrated diversity without blurring them together.
  ensemble_size: 4
  ensemble_batches: 3
  sampling_seed: 42
  probabilistic_score_sharpness_weight: 1.0
  probabilistic_score_peak_weight: 0.25
  probabilistic_peak_fraction: 0.005
  log_reconstruction_images: false
  # Prefer members that retain most, but not all, of SAR's gradient strength.
  probabilistic_score_target_sharpness_ratio: 0.9

logging:
  wandb:
    enabled: true
    project: dif_img_rec
    name: geo-sar-10bands-era5-diffusion-residual-deterministic
    save_dir: logs
    log_model: false
