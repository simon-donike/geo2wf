[project]
name = "geo2wf"
version = "0.1.0"
description = "GEO-to-SAR tropical-cyclone wind-field reconstruction and intensity estimation."
requires-python = ">=3.10,<3.12"
dependencies = [
    "global-land-mask>=1.0.0",
    "h5netcdf>=1.3,<2.0",
    "h5py>=3.8,<4.0",
    "hydra-core>=1.3,<2.0",
    "imageio>=2.25,<3.0",
    "matplotlib>=3.6,<3.9",
    "numpy>=1.23,<2.0",
    "pandas>=2.0,<3.0",
    "pytorch-lightning==1.9.3",
    "pyyaml>=6.0,<7.0",
    "rasterio>=1.3,<2.0",
    "scikit-image>=0.20,<0.23",
    "scipy>=1.10,<2.0",
    "setuptools>=65.0,<81.0",
    "torch>=1.13,<2.2",
    "typing-extensions>=4.0,<5.0",
    "tqdm>=4.64,<5.0",
    "wandb>=0.24.0",
    "xarray>=2023.1,<2026.0",
]

[project.optional-dependencies]
# Containers explicitly select their compute backend.
cpu = ["torch==2.1.2"]
cuda = ["torch==2.1.2"]

[tool.uv]
cache-dir = ".uv-cache"
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu121", extra = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[project.scripts]
geo2wf-train = "geo2wf.cli.train:main"
geo2wf-evaluate = "geo2wf.cli.evaluate:main"
geo2wf-infer = "geo2wf.cli.infer:main"
geo2wf-export = "geo2wf.cli.export:main"
geo2wf-operational = "geo2wf.operational.cli:main"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geo2wf*"]

[tool.setuptools.package-data]
"geo2wf.operational" = ["models.json"]

[dependency-groups]
artifacts = [
    "huggingface-hub==2.1.1",
]
operational = [
    "fsspec[http]>=2024.6,<2026",
    "pyproj>=3.6,<3.8",
]
dev = [
    "black>=24,<26",
    "pytest>=8.0,<9.0",
]
docs = [
    "mkdocs-glightbox>=0.4,<1.0",
    "mkdocs-material>=9.6,<10.0",
    "mkdocs-minify-plugin>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
