[project]
name = "dif-img-rec"
version = "0.1.0"
description = "Conditional pixel diffusion for GEO-to-SAR tropical cyclone wind fields."
requires-python = ">=3.10,<3.12"
dependencies = [
    "einops>=0.6,<0.9",
    "global-land-mask>=1.0.0",
    "h5netcdf>=1.3,<2.0",
    "h5py>=3.8,<4.0",
    "imageio>=2.25,<3.0",
    "matplotlib>=3.6,<3.9",
    "numpy>=1.23,<2.0",
    "pandas>=2.0,<3.0",
    "pytorch-lightning==1.9.3",
    "pyyaml>=6.0,<7.0",
    "rasterio>=1.3,<2.0",
    "scikit-image>=0.20,<0.23",
    "scipy>=1.10,<2.0",
    "setuptools>=65.0,<81.0",
    "torch>=1.13,<2.2",
    "torchvision>=0.14,<0.17",
    "tqdm>=4.64,<5.0",
    "wandb>=0.24.0",
    "xarray>=2023.1,<2026.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.uv]
package = false
