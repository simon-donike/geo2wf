name: Docker stack
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.dockerignore'
      - 'compose*.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**'
      - 'scripts/**'
      - 'configs/**'
      - 'tests/**'
      - 'apps/stormsense/**'
      - '.github/workflows/docker.yml'
  push:
    branches: [main, conference-release]
    paths:
      - '.dockerignore'
      - 'compose*.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**'
      - 'scripts/**'
      - 'configs/**'
      - 'tests/**'
      - 'apps/stormsense/**'
      - '.github/workflows/docker.yml'
permissions:
  contents: read
jobs:
  stack:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, cuda]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - run: docker compose --profile '*' config --quiet
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/stormsense/runner/Dockerfile
          target: full-stack
          build-args: TORCH_BACKEND=${{ matrix.backend }}
          tags: geo2wf:test
          load: true
          cache-from: type=gha,scope=geo2wf-${{ matrix.backend }}
          cache-to: type=gha,mode=max,scope=geo2wf-${{ matrix.backend }}
      - name: Check tools, training and inference inside the image
        run: |
          docker run --rm geo2wf:test help
          docker run --rm geo2wf:test train --help
          docker run --rm geo2wf:test operational --help
          docker run --rm geo2wf:test download --help
          docker run --rm geo2wf:test hf version
          docker run --rm geo2wf:test rclone version
          docker run --rm geo2wf:test wrangler --version
          docker run --rm -e OMP_NUM_THREADS=2 -e OPENBLAS_NUM_THREADS=1 geo2wf:test test -q tests/test_container_runner.py tests/test_intensity_training_integration.py tests/test_intensity_correction.py tests/operational
      - name: Check selected PyTorch backend
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          docker run --rm -e BACKEND geo2wf:test python -c 'import os, torch; assert (torch.version.cuda is None) == (os.environ["BACKEND"] == "cpu"); print(torch.__version__, torch.version.cuda)'
      - name: Validate website deployment and documentation without credentials
        if: matrix.backend == 'cpu'
        run: |
          docker run --rm geo2wf:test deploy-check
          docker run --rm geo2wf:test docs build --strict --site-dir artifacts/site
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/stormsense/runner/Dockerfile
          target: web
          tags: geo2wf:web-test
          load: true
          cache-from: type=gha,scope=geo2wf-web
          cache-to: type=gha,mode=max,scope=geo2wf-web
      - name: Verify HTTP and SPA routes
        run: |
          docker run -d --name geo2wf-web-test -p 127.0.0.1:8080:8080 geo2wf:web-test
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/storms/AL012026
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/data/missing.json)" = 404
      - if: always()
        run: docker rm -f geo2wf-web-test
