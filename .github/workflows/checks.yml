name: Checks
on:
  pull_request:
  push:
    branches: [main, conference-release]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --frozen --group dev --group docs --group operational
      - run: uv run python -m pytest -q
        env:
          OMP_NUM_THREADS: '2'
      - run: uv run mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: '1'
      - run: uv run python scripts/check_site_links.py

  stormsense-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/stormsense
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/stormsense/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:worker
